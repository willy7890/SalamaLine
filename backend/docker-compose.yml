# Local/staging stack. Put POSTGRES_PASSWORD and the other secrets in .env (see .env.example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: salamaline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: salamaline
    ports: ["127.0.0.1:5432:5432"]   # not exposed beyond this machine
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salamaline -d salamaline"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # short-lived state only, never persisted
    ports: ["127.0.0.1:6379:6379"]

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: &app-env
      DATABASE_URL: postgresql://salamaline:${POSTGRES_PASSWORD}@db:5432/salamaline?schema=public
      REDIS_URL: redis://redis:6379
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker"]
    env_file: .env
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

volumes:
  pgdata:
